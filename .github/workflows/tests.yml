name: VisionGuard checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -c "import cv2; print('OpenCV', cv2.__version__); assert cv2.__version__.startswith('5.')"
      - run: pytest -q
